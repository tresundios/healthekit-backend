# Local Mac — infra only; run uvicorn on host for hot reload
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: healthekit
      POSTGRES_PASSWORD: healthekit
      POSTGRES_DB: healthekit_local
    ports: ["5432:5432"]
    volumes: [pgdata_local:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  pgdata_local:
