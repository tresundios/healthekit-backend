# api.dev.healthekit.in + dev.healthekit.in on one box (Let's Encrypt certs)
server {
  listen 80;
  server_name dev.healthekit.in api.dev.healthekit.in;
  return 301 https://$host$request_uri;
}
server {
  listen 443 ssl;
  server_name api.dev.healthekit.in;
  ssl_certificate     /etc/letsencrypt/live/api.dev.healthekit.in/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/api.dev.healthekit.in/privkey.pem;
  location / { proxy_pass http://api:8000; proxy_set_header Host $host;
               proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
               proxy_set_header X-Forwarded-Proto https; }
}
server {
  listen 443 ssl;
  server_name dev.healthekit.in;
  ssl_certificate     /etc/letsencrypt/live/dev.healthekit.in/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/dev.healthekit.in/privkey.pem;
  location / { proxy_pass http://web:80; }
}
