services:
  api:
    build: ..                       # uses the repo's Dockerfile
    env_file: [../.env]
    environment:
      DATABASE_URL: postgresql+psycopg://healthekit:healthekit@postgres:5432/healthekit_local
      REDIS_URL: redis://redis:6379/0
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ..:/app                     # live code mount -> hot reload inside Docker
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    restart: unless-stopped
  web:
    build:
      context: ../../healthekit-frontend    # adjust if repos sit elsewhere side-by-side
    ports: ["5173:80"]
    depends_on: [api]
    restart: unless-stopped
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: healthekit
      POSTGRES_PASSWORD: healthekit
      POSTGRES_DB: healthekit_local
    ports: ["5432:5432"]
    volumes: [pgdata_local:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthekit -d healthekit_local"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  pgdata_local: