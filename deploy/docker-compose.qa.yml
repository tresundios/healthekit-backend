# qa — single EC2, everything via compose behind nginx (ports 80/443)
services:
  api:
    image: navistresundios/healthekit-backend:${BACKEND_TAG:-qa-latest}
    env_file: [/opt/healthekit/env/.env.qa]
    depends_on: [postgres, redis]
    restart: unless-stopped
    expose: ["8000"]
  web:
    image: navistresundios/healthekit-frontend:${FRONTEND_TAG:-qa-latest}
    restart: unless-stopped
    expose: ["80"]
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: healthekit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in /opt/healthekit/env}
      POSTGRES_DB: healthekit_qa
    volumes: [pgdata:/var/lib/postgresql/data]
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    restart: unless-stopped
  nginx:
    image: nginx:1.27-alpine
    ports: ["80:80", "443:443"]
    volumes:
      - /opt/healthekit/nginx/qa.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on: [api, web]
    restart: unless-stopped
volumes:
  pgdata:
