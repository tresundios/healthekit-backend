# PROD — app boxes behind AWS ALB (TLS at ALB via ACM). DB=RDS, Cache=ElastiCache.
# nginx here serves the SPA and proxies /api to the api container on the same box.
services:
  api:
    image: navistresundios/healthekit-backend:${BACKEND_TAG:?pin an immutable tag}
    env_file: [/opt/healthekit/env/.env.prod]
    restart: always
    expose: ["8000"]
  web:
    image: navistresundios/healthekit-frontend:${FRONTEND_TAG:?pin an immutable tag}
    restart: always
    expose: ["80"]
  nginx:
    image: nginx:1.27-alpine
    ports: ["80:80"]          # ALB terminates TLS; instances listen on 80 in private subnet
    volumes:
      - /opt/healthekit/nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
    restart: always
