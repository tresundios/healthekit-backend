name: dev — test, build, push, deploy
on:
  push:
    branches: [develop]

env:
  IMAGE: navistresundios/healthekit-backend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check app tests
      - run: pytest -q --cov=app

  build-push-deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: tag
        run: echo "tag=dev-${{ github.run_number }}-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
      - name: deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ubuntu
          key: ${{ secrets.DEV_SSH_KEY }}
          script: |
            cd /opt/healthekit
            export BACKEND_TAG=${{ steps.tag.outputs.tag }}
            docker compose -f docker-compose.dev.yml pull api
            docker compose -f docker-compose.dev.yml up -d api
            docker image prune -f
      - name: smoke
        run: sleep 10 && curl -sf https://api.dev.healthekit.in/healthz
